services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: katalog_whatsapp
      POSTGRES_USER: katalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_in_environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katalog -d katalog_whatsapp"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env.production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
  web:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set_in_environment}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
volumes:
  postgres_data:
  uploads_data:
